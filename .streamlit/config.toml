# Macondo theme for running in development mode (python -m streamlit run ...).
# The .exe files do NOT use this file: the theme is built into _launcher_base.py.
[theme]
base = "light"
primaryColor = "#f0b802"
backgroundColor = "#FFFDF7"
secondaryBackgroundColor = "#F5E6C8"
textColor = "#3B2F1E"
font = "sans serif"

[browser]
gatherUsageStats = false
